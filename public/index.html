<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta name="description" content="Flores Eternamente Bellas — catálogo de flores, ramos y accesorios. Pedidos y consultas por WhatsApp.">
    <% if (htmlWebpackPlugin.options.ogPageUrl) { %>
    <meta property="og:site_name" content="Flores Eternamente Bellas">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_CL">
    <meta property="og:title" content="<%= htmlWebpackPlugin.options.title %>">
    <meta property="og:description" content="Catálogo de flores, ramos y accesorios. Haz tu pedido por WhatsApp.">
    <meta property="og:url" content="<%= htmlWebpackPlugin.options.ogPageUrl %>">
    <meta property="og:image" content="<%= htmlWebpackPlugin.options.ogImageUrl %>">
    <meta property="og:image:alt" content="Flores Eternamente Bellas">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="<%= htmlWebpackPlugin.options.title %>">
    <meta name="twitter:description" content="Catálogo de flores, ramos y accesorios. Pedidos por WhatsApp.">
    <meta name="twitter:image" content="<%= htmlWebpackPlugin.options.ogImageUrl %>">
    <% } %>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
  </body>
</html>
